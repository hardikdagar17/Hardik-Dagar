<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 25px;
            align-items: center;
            gap: 15px;
        }

        .header a {
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .profile {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #4285f4;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 80px;
            font-weight: bold;
            letter-spacing: -3px;
        }

        .logo span:nth-child(1) { color: #4285f4; }
        .logo span:nth-child(2) { color: #ea4335; }
        .logo span:nth-child(3) { color: #fbbc05; }
        .logo span:nth-child(4) { color: #4285f4; }
        .logo span:nth-child(5) { color: #34a853; }
        .logo span:nth-child(6) { color: #ea4335; }

        .search-box {
            margin-top: 25px;
            width: 580px;
            max-width: 90%;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 45px;
            border-radius: 30px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 16px;
        }

        .search-box input:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }

        .buttons {
            margin-top: 30px;
        }

        .buttons button {
            padding: 10px 18px;
            margin: 5px;
            border: 1px solid #f2f2f2;
            background-color: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .buttons button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        /* Footer */
        .footer {
            background-color: #f2f2f2;
            padding: 15px 25px;
            font-size: 14px;
        }

        .footer-top {
            margin-bottom: 10px;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .footer-bottom div a {
            margin-right: 15px;
            text-decoration: none;
            color: #70757a;
        }

        .footer-bottom div a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <div class="profile">H</div>
    </div>

    <!-- Main Section -->
    <div class="main">
        <div class="logo">
            <span>G</span>
            <span>o</span>
            <span>o</span>
            <span>g</span>
            <span>l</span>
            <span>e</span>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search Google or type a URL">
        </div>

        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-top">
            India
        </div>
        <div class="footer-bottom">
            <div>
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </div>

</body>
</html>
