<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Store Advanced</title>

<style>
/* GENERAL */
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#1db954;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
}

header input{
    width:55%;
    padding:10px;
    border:none;
    border-radius:20px;
    outline:none;
}

.categories{
    display:flex;
    gap:15px;
    padding:10px 15px;
    overflow-x:auto;
    background:white;
    position:sticky;
    top:70px;
    z-index:999;
}

.categories button{
    padding:8px 18px;
    border:none;
    border-radius:20px;
    background:#e2e2e2;
    cursor:pointer;
}

.categories button.active{
    background:#1db954;
    color:white;
}

.container{
    padding:20px;
}

h2{
    margin-bottom:10px;
}

.app-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:20px;
}

.app{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    text-align:center;
    cursor:pointer;
    transition:0.2s;
}

.app:hover{
    transform:scale(1.03);
}

.app img{
    width:80px;
    height:80px;
    border-radius:20px;
    margin-bottom:10px;
}

.app button{
    width:100%;
    margin-top:8px;
    padding:8px;
    border:none;
    background:#1db954;
    color:white;
    border-radius:20px;
    cursor:pointer;
}

/* POPUP */
#popup{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup-box{
    background:white;
    width:90%;
    max-width:400px;
    padding:20px;
    border-radius:20px;
    text-align:center;
    animation:pop 0.3s;
}

@keyframes pop{
    0%{transform:scale(0.7);}
    100%{transform:scale(1);}
}

.popup-box img{
    width:120px;
    height:120px;
    border-radius:25px;
}

.close{
    margin-top:15px;
    padding:8px 20px;
    background:red;
    color:white;
    border:none;
    border-radius:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <h1>Play Store</h1>
    <input id="search" type="text" placeholder="Search Apps...">
</header>

<!-- CATEGORIES -->
<div class="categories">
    <button class="active" onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('social')">Social</button>
    <button onclick="filterCategory('music')">Music</button>
    <button onclick="filterCategory('games')">Games</button>
    <button onclick="filterCategory('video')">Video</button>
</div>

<!-- MAIN APPS SECTION -->
<div class="container">
    <h2>Top Apps</h2>
    <div id="appGrid" class="app-grid"></div>
</div>

<!-- POPUP -->
<div id="popup">
    <div class="popup-box">
        <img id="pIcon">
        <h2 id="pName"></h2>
        <p id="pRating"></p>
        <p id="pDesc"></p>
        <button class="close" onclick="closePopup()">Close</button>
    </div>
</div>

// DISPLAY APPS
function loadApps(list){
    const grid = document.getElementById("appGrid");
    grid.innerHTML="";
    list.forEach(app=>{
        grid.innerHTML+=`
        <div class='app' onclick='openPopup("${app.name}")'>
            <img src="${app.icon}">
            <h3>${app.name}</h3>
            <p>⭐ ${app.rating}</p>
            <button>Install</button>
        </div>`;
    });
}

loadApps(apps);

// SEARCH
document.getElementById("search").addEventListener("input", e=>{
    const val = e.target.value.toLowerCase();
    const filtered = apps.filter(a=>a.name.toLowerCase().includes(val));
    loadApps(filtered);
});

// CATEGORY FILTER
function filterCategory(cat){
    document.querySelectorAll(".categories button").forEach(btn=>btn.classList.remove("active"));
    event.target.classList.add("active");
    loadApps(cat==="all" ? apps : apps.filter(a=>a.category===cat));
}

// POPUP
function openPopup(appName){
    const app = apps.find(a=>a.name===appName);
    document.getElementById("pIcon").src=app.icon;
    document.getElementById("pName").innerText=app.name;
    document.getElementById("pRating").innerText="⭐ Rating: "+app.rating;
    document.getElementById("pDesc").innerText=app.desc;
    document.getElementById("popup").style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}
</script>
